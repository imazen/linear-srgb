# CI-free public-API snapshot runner — the only package depending on
# zenutils-apidoc. The empty [workspace] table detaches it from the parent
# package (linear-srgb has no workspace table to `exclude` it from), so plain
# `cargo test` and every CI job (including --all-features ones) never
# compile the apidoc tree or run rustdoc. Regenerate via `just api-doc`.
[package]
name = "linear-srgb-apidoc"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# Cross-target capture support is not yet published; dev-only pinned source.
zenutils-apidoc = { version = "0.1.2", git = "https://github.com/imazen/zenutils", rev = "f3058c9cfa9be1707a586f35ab60f103f73179da" }
