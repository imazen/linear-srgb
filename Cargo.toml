[package]
name = "linear-srgb"
version = "0.6.12"
authors = ["Lilith River"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Fast linear↔sRGB color space conversion with FMA acceleration and LUT support"
repository = "https://github.com/imazen/linear-srgb"
readme = "README.crates.md"
keywords = ["color", "srgb", "linear", "gamma", "conversion"]
categories = ["graphics", "multimedia::images", "no-std"]
exclude = [
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".superwork/",
    ".zenbench/",
    "copter-report/",
    ".github/",
    "Cross.toml",
    "justfile",
    "Cargo.toml.original.txt",
    "fuzz/",
    # CI assembly/API snapshots — dev-only, not needed by crate consumers
    "asm-snapshots/",
    "api-snapshots/",
    # Dev scripts and Python curve-fitting utilities
    "scripts/",
    # Committed benchmark result docs — historical, not needed by consumers
    "benchmarks/",
    # Root scratch/historical performance notes
    "perf.md",
    # Dev-only reference notes
    "docs/",
    # Test suite — not needed in the published package
    "tests/",
    # Root .gitignore — not needed by consumers
    ".gitignore",
]
# NOTE: benches/ is intentionally NOT excluded. The three benches below are
# `harness = false` (zenbench/criterion-compat), so they MUST be declared as
# explicit `[[bench]]` targets — and a declared target whose source file is
# excluded makes `cargo package` verification fail. Benches are small (~76 KB).

[package.metadata.docs.rs]
all-features = true

[dependencies]
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
bytemuck = "1.21"
archmage = { version = "0.9.22", default-features = false, features = ["macros"] }
magetypes = { version = "0.9.22", default-features = false, features = ["w512"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zenbench = { version = "0.1.2", features = ["criterion-compat"] }

[features]
default = ["std", "avx512"]
# Enable std library (required for runtime SIMD dispatch)
std = ["num-traits/std", "archmage/std", "magetypes/std"]
# AVX-512 support (V4/V4x tiers for incant! dispatch and rites)
avx512 = ["archmage/avx512", "magetypes/avx512"]
# Include alternative/experimental implementations for benchmarking
alt = []
# No-op since 0.6.2 — all paths are now safe Rust. Kept for backward compatibility.
# TODO: remove in 0.7
unsafe_simd = []
# Transfer functions: sRGB, BT.709, PQ, HLG — scalar + SIMD rites
transfer = []
# IEC 61966-2-1 textbook constants (legacy, for interop with software that uses the original spec)
iec = []

[[example]]
name = "accuracy_comparison"
required-features = ["std", "alt"]

[[example]]
name = "generate_all_luts"
required-features = ["std"]

# `asm-stub` is built (not run) by `scripts/dump-asm.sh` and the
# `.github/workflows/asm-snapshots.yml` CI gate to capture per-target
# codegen of the public dispatchers (issue #23 Pattern 2 verification).
[[example]]
name = "asm-stub"
required-features = ["std", "transfer"]

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "tf_bench"
harness = false
required-features = ["transfer"]

[[bench]]
name = "rgba_approach"
harness = false
