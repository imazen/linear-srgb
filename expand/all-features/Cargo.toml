# Separate resolution anchor: cargo expand cannot select features on a
# dependency package with --features/--all-features. These dependency edges
# select the real library's features without copying its source or manifest.
[package]
name = "linear-srgb-expand-all"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "../src/lib.rs"

[dependencies]
linear-srgb = { path = "../..", features = ["std", "avx512", "alt", "iec", "precise-portable", "transfer", "unsafe_simd"] }
archmage = { version = "=0.9.32", git = "https://github.com/imazen/archmage", rev = "294ebd260ed665e1b4b0a0a03940bc493d12c666", default-features = false, features = ["macros"] }
magetypes = { version = "=0.9.32", git = "https://github.com/imazen/archmage", rev = "294ebd260ed665e1b4b0a0a03940bc493d12c666", default-features = false, features = ["w512"] }
