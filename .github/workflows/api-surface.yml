name: API surface

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Superseded runs only waste runner queue — particularly the macOS
# jobs, which wait on GitHub's scarcest pool. Only the newest
# commit's run matters per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver-checks:
    name: cargo semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: all-features

  snapshots:
    name: API snapshots (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - wasm32-wasip1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-13
          targets: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: api-${{ matrix.target }}
          workspaces: |
            . -> target
            apidoc -> target
      - name: Verify the target's complete committed API snapshots
        run: cargo test --locked --manifest-path apidoc/Cargo.toml -- --nocapture
        env:
          ZEN_API_DOC: check
          ZEN_API_DOC_TOOLCHAIN: nightly-2026-07-13
          ZEN_API_DOC_TARGET: ${{ matrix.target }}
      - name: Verify exactly the direct replacements for this target
        run: python3 scripts/check_target_features_api.py --target "${{ matrix.target }}"
      - name: Check inventory guard mutations
        run: python3 scripts/test_target_features_api.py

  expansions:
    name: Expanded SIMD (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - wasm32-wasip1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: expand-${{ matrix.target }}
          workspaces: . -> target/expand
      - name: Install pinned cargo-expand
        run: cargo install cargo-expand --locked --version 1.0.126
      - name: Typecheck and compare default and all-feature expansions
        run: python3 scripts/expand_snapshots.py --check --target "${{ matrix.target }}"
