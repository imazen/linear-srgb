name: ASM snapshots

# Two-tier gate (issue #24 hardening):
#
#   1. `*.essence` — opcode-only normalized form. Stripped of registers,
#      immediates, basic-block labels, .cfi_* directives, and section
#      metadata; what remains is the instruction *shape*. **Asserted as
#      a hard gate** via `git diff --exit-code` — drift here means
#      something genuinely changed in codegen (new instruction types,
#      altered instruction count, memory-access pattern shift), not just
#      register renaming or label renumbering.
#
#   2. `*.s` — full assembly listing. Diff is rendered into the GitHub
#      job summary for human review, and the regenerated files are
#      uploaded as a per-target artifact. **Not a hard gate** — these
#      drift on cosmetic toolchain reshuffles that the essence form
#      normalizes away.
#
# The dump itself runs under `continue-on-error: true` — if linker /
# tooling format issues break the dump, the failure shows in the summary
# instead of blocking the PR. Real fixes get tracked in issue #24.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Superseded runs only waste runner queue — particularly the macOS
# jobs, which wait on GitHub's scarcest pool. Only the newest
# commit's run matters per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asm-diff:
    name: ASM snapshot diff (informational)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # `cargo asm --example=asm-stub` builds a binary, which means linking.
      # Cross-targets need a cross linker; ubuntu-latest doesn't have one
      # by default. wasm32 is fine (wasm-ld ships with rustc); aarch64 needs
      # gcc-aarch64-linux-gnu and a cargo config pointing at it.
      - name: Install cross-linker for aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          # Append (don't overwrite — repo may have a checked-in config).
          if ! grep -q 'aarch64-unknown-linux-gnu.*linker' .cargo/config.toml 2>/dev/null; then
            cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
          fi

      - uses: Swatinem/rust-cache@v2

      # Pin cargo-show-asm so output-format changes between releases don't
      # spuriously break the gate. Bump the pin in the same PR that
      # regenerates snapshots after verifying the format diff is benign.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-show-asm@0.2.58

      - name: Re-dump
        # Don't fail the job if the dump itself errors — surface the failure
        # in the summary. Real reasons it might fail (linker missing, cargo
        # asm output format change) are worth seeing without blocking PRs.
        continue-on-error: true
        id: dump
        run: scripts/dump-asm.sh "${{ matrix.target }}"

      - name: Render diff in job summary
        if: always()
        run: |
          {
            echo "## ASM snapshot diff — \`${{ matrix.target }}\`"
            echo ""
            if [[ "${{ steps.dump.outcome }}" == "failure" ]]; then
              echo "**\`scripts/dump-asm.sh\` failed on this target.** See the"
              echo "step log above for the actual error. Snapshot comparison"
              echo "is skipped this run."
              exit 0
            fi
            if git diff --quiet asm-snapshots/${{ matrix.target }}; then
              echo "No drift — codegen and essence both unchanged."
              exit 0
            fi
            essence_drifted=no
            full_drifted=no
            git diff --quiet "asm-snapshots/${{ matrix.target }}/*.essence" \
              || essence_drifted=yes
            git diff --quiet "asm-snapshots/${{ matrix.target }}/*.s" \
              || full_drifted=yes
            if [[ "$essence_drifted" == "yes" ]]; then
              echo "**Opcode-essence drifted.** This is the hard-gated form;"
              echo "drift here means real codegen change (new instructions,"
              echo "different instruction count, altered memory-access shape)."
              echo "The job will fail in the next step."
            elif [[ "$full_drifted" == "yes" ]]; then
              echo "**Cosmetic .s drift only.** Essence is unchanged →"
              echo "register renaming / label renumbering / scheduling reshuffle."
              echo "Not a CI failure; review at your leisure and regenerate"
              echo "the .s files when convenient."
            fi
            echo ""
            echo "Regenerate locally if the change is intentional:"
            echo ""
            echo '```'
            echo "scripts/dump-asm.sh ${{ matrix.target }}"
            echo '```'
            echo ""
            echo "Full snapshots are attached as the"
            echo "\`asm-${{ matrix.target }}\` artifact."
            echo ""
            echo "<details><summary>Files with drift</summary>"
            echo ""
            echo '```'
            git diff --stat asm-snapshots/${{ matrix.target }}
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>Essence diff (the gated form)</summary>"
            echo ""
            echo '```diff'
            git diff -- "asm-snapshots/${{ matrix.target }}/*.essence" || true
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>Full .s diff (review only)</summary>"
            echo ""
            echo '```diff'
            git diff -- "asm-snapshots/${{ matrix.target }}/*.s" || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # Hard gate on the opcode-essence files.
      - name: Assert essence unchanged (hard gate)
        if: steps.dump.outcome == 'success'
        run: |
          if ! git diff --exit-code -- "asm-snapshots/${{ matrix.target }}/*.essence"; then
            echo ""
            echo "::error::Opcode essence drifted on ${{ matrix.target }}."
            echo "If the change is intentional (e.g., a deliberate refactor),"
            echo "regenerate locally and commit:"
            echo "  scripts/dump-asm.sh ${{ matrix.target }}"
            echo "See asm-snapshots/README.md for what counts as a real"
            echo "codegen change vs cosmetic noise."
            exit 1
          fi

      - name: Upload regenerated snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asm-${{ matrix.target }}
          path: asm-snapshots/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 30
