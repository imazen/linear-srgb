name: ASM snapshots

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  asm-diff:
    name: ASM snapshot diff
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # `cargo asm --example=asm-stub` builds a binary, which means linking.
      # Cross-targets need a cross linker; ubuntu-latest doesn't have one
      # by default. wasm32 is fine (wasm-ld ships with rustc); aarch64 needs
      # gcc-aarch64-linux-gnu and a cargo config pointing at it.
      - name: Install cross-linker for aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          # Append (don't overwrite — repo may have a checked-in config).
          if ! grep -q 'aarch64-unknown-linux-gnu.*linker' .cargo/config.toml 2>/dev/null; then
            cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
          fi

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-show-asm

      - name: Re-dump and diff
        run: |
          if ! scripts/dump-asm.sh "${{ matrix.target }}"; then
            echo "::error::cargo asm dump failed"
            exit 1
          fi
          if ! git diff --exit-code asm-snapshots/${{ matrix.target }}; then
            echo ""
            echo "::error::ASM codegen drifted on ${{ matrix.target }}."
            echo "Inspect the diff above. If the change is intentional"
            echo "(e.g., a deliberate refactor), regenerate the snapshot:"
            echo "  scripts/dump-asm.sh ${{ matrix.target }}"
            echo "and commit the result. See asm-snapshots/README.md for"
            echo "what counts as 'OK drift' vs 'load-bearing diff'."
            exit 1
          fi
